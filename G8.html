<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلول التدريبات الإثرائية - مادة الحوسبة وتكنولوجيا المعلومات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #0d9488;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #15803d;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --secondary: #14b8a6;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --correct-bg: #064e3b;
            --correct-border: #10b981;
            --correct-text: #6ee7b7;
            --incorrect-bg: #7f1d1d;
            --incorrect-border: #f87171;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a, #0d9488);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* Controls Section */
        .controls-card {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn, .tab-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .tab-btn.active, .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Tabs Navigation */
        .tabs-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .tabs-nav .tab-btn {
            white-space: nowrap;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            text-align: center;
        }

        .stat-item h4 {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stat-item span {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-light);
        }

        /* Question Cards */
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            position: relative;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
        }

        .badge {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary-light);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Options for MCQ */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .option-btn {
            background: var(--bg);
            border: 1.5px solid var(--border);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            text-align: right;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .option-btn:hover {
            border-color: var(--primary-light);
        }

        .option-btn.selected-correct {
            background: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: bold;
        }

        .option-btn.selected-incorrect {
            background: var(--incorrect-bg);
            border-color: var(--incorrect-border);
            color: var(--incorrect-border);
        }

        /* Direct Answer Box for non-MCQ */
        .toggle-answer-btn {
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .answer-box {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: var(--correct-bg);
            border: 1px solid var(--correct-border);
            color: var(--correct-text);
            border-radius: 8px;
            font-weight: 600;
            line-height: 1.7;
        }

        .answer-box.show {
            display: block;
        }

        /* Table styling for comparison / structured data */
        .q-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            border-radius: 8px;
            overflow: hidden;
        }

        .q-table th, .q-table td {
            border: 1px solid var(--border);
            padding: 0.75rem;
            text-align: center;
        }

        .q-table th {
            background: var(--primary);
            color: white;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        @media print {
            .theme-toggle, .controls-card, .tabs-nav, .stats-bar, .toggle-answer-btn {
                display: none !important;
            }
            .answer-box {
                display: block !important;
            }
            body {
                background: white;
                color: black;
            }
            .question-card {
                box-shadow: none;
                border: 1px solid #ccc;
                page-break-inside: avoid;
            }
        }
    </style>
</head>

        let currentDocFilter = 'all';
        let currentTypeFilter = 'all';
        let answeredQuestions = new Set();
        let correctAnswersCount = 0;

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            container.innerHTML = '';

            let filtered = questionsData.filter(q => {
                const matchDoc = (currentDocFilter === 'all' || q.doc === currentDocFilter);
                const matchType = (currentTypeFilter === 'all' || q.type === currentTypeFilter);
                const matchSearch = q.title.toLowerCase().includes(searchVal) || 
                                    (q.content && q.content.toLowerCase().includes(searchVal)) ||
                                    (q.options && q.options.some(o => o.toLowerCase().includes(searchVal)));
                return matchDoc && matchType && matchSearch;
            });

            document.getElementById('totalQuestionsCount').innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">لم يتم العثور على أسئلة تطابق البحث أو الفلتر المحدد.</div>';
                return;
            }

            filtered.forEach((q, index) => {
                const qCard = document.createElement('div');
                qCard.className = 'question-card';

                let html = `
                    <div class="question-header">
                        <div class="question-title">${index + 1}. ${q.title}</div>
                        <span class="badge">${q.badge}</span>
                    </div>
                `;

                if (q.type === 'mcq') {
                    html += `<div class="options-grid">`;
                    q.options.forEach(opt => {
                        html += `<button class="option-btn" onclick="checkMCQ(this, '${opt.replace(/'/g, "\'")}', '${q.answer.replace(/'/g, "\'")}', ${index})">
                            <span>⚪</span> ${opt}
                        </button>`;
                    });
                    html += `</div>`;
                } else {
                    html += `
                        <button class="toggle-answer-btn" onclick="toggleAnswer(this)">إظهار الإجابة / النموذج</button>
                        <div class="answer-box">${q.content}</div>
                    `;
                }

                qCard.innerHTML = html;
                container.appendChild(qCard);
            });
        }

        function checkMCQ(btn, selected, correct, qIndex) {
            const parent = btn.closest('.options-grid');
            const buttons = parent.querySelectorAll('.option-btn');

            buttons.forEach(b => {
                b.disabled = true;
                b.classList.remove('selected-correct', 'selected-incorrect');
            });

            if (selected === correct) {
                btn.classList.add('selected-correct');
                btn.querySelector('span').innerText = '✅';
                if (!answeredQuestions.has(qIndex)) {
                    correctAnswersCount++;
                }
            } else {
                btn.classList.add('selected-incorrect');
                btn.querySelector('span').innerText = '❌';
                // Highlight correct one
                buttons.forEach(b => {
                    if (b.innerText.includes(correct)) {
                        b.classList.add('selected-correct');
                        b.querySelector('span').innerText = '✅';
                    }
                });
            }

            if (!answeredQuestions.has(qIndex)) {
                answeredQuestions.add(qIndex);
                document.getElementById('answeredCount').innerText = answeredQuestions.size;
                document.getElementById('correctCount').innerText = correctAnswersCount;
            }
        }

        function toggleAnswer(btn) {
            const answerBox = btn.nextElementSibling;
            if (answerBox.classList.contains('show')) {
                answerBox.classList.remove('show');
                btn.innerText = 'إظهار الإجابة / النموذج';
            } else {
                answerBox.classList.add('show');
                btn.innerText = 'إخفاء الإجابة';
            }
        }

        function switchDoc(docId) {
            currentDocFilter = docId;
            document.querySelectorAll('#docTabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderQuestions();
        }

        function filterType(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.filter-group .filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderQuestions();
        }

        function filterQuestions() {
            renderQuestions();
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            if (current === 'dark') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', 'dark');
            }
        }

        // Initial render
        renderQuestions();
    </script>
